server:
  address: tcp://0.0.0.0:9091/
  tls:
    certificate: /config/public.crt
    key: /config/private.pem

log:
  level: info

ntp:
  disable_startup_check: true
  disable_failure: true

telemetry:
  metrics:
    enabled: false

identity_validation:
  reset_password:
    jwt_secret: a_very_secure_jwt_secret_key_itam_2026_32chars

session:
  secret: a_very_secure_session_secret_itam_2026_32chars
  cookies:
    - domain: 127.0.0.1
      authelia_url: https://127.0.0.1:9091

storage:
  encryption_key: a_very_secure_storage_encryption_key_32chars
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: one_factor
  rules:
    - domain: ["localhost"]
      policy: one_factor

