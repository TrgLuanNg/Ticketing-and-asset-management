services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia-sso
    restart: unless-stopped
    volumes:
      - ./authelia/config:/config
    ports:
      - "9091:9091"
    environment:
      - TZ=Asia/Ho_Chi_Minh

  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: itam-go-backend
    restart: unless-stopped
    ports:
      - "44318:44318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=44318
      - DATABASE_DRIVER=postgres
      - DATABASE_POSTGRES_HOST=host.docker.internal
      - DATABASE_POSTGRES_PORT=5432
      - DATABASE_POSTGRES_USER=postgres
      - DATABASE_POSTGRES_PASSWORD=dgnchitg
      - DATABASE_POSTGRES_DBNAME=itam_db
      - SSO_HOST=https://authelia:9091
      - SSO_ISSUER_HOST=127.0.0.1:9091
      - SSO_CLIENT_ID=itam-client
      - SSO_SECRET_KEY=itam_secret_key_2026
    depends_on:
      - authelia

  angular-frontend:
    build:
      context: ./angular-frontend
      dockerfile: Dockerfile
    container_name: itam-frontend
    restart: unless-stopped
    volumes:
      - ./angular-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4200:4200"
    depends_on:
      - go-backend
