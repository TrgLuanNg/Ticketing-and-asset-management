server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA routing: test if exact file exists ($uri), otherwise fallback to /index.html.
    # IMPORTANT: Do NOT include $uri/ because routes like /assets collide with the /assets/ static folder on disk,
    # causing Nginx to look for an index file in that folder and return 403 Forbidden on reload.
    location / {
        try_files $uri /index.html;
    }

    # Optional: Cache control for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
